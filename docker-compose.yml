services:
  app:
    build:
      context: .
    image: kyuing-bot:latest
    container_name: kyuing-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-5001}:${WEB_PORT:-5001}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + __import__('os').environ.get('WEB_PORT', '5001') + '/health/ready', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
